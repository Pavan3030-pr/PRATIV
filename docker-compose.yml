version: '3.8'

services:
  signalpost-database:
    image: ankane/pgvector:v0.5.1
    container_name: signalpost-postgres-node
    environment:
      POSTGRES_DB: signalpost_analytics_prod
      POSTGRES_USER: engine_admin_chandra
      POSTGRES_PASSWORD: VaultProductionPassword2026_Secure
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U engine_admin_chandra -d signalpost_analytics_prod"]
      interval: 5s
      timeout: 5s
      retries: 5

  signalpost-agent:
    build: ./agent
    container_name: jbox-langgraph-agent
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    restart: always

  signalpost-core-backend:
    build: ./backend
    container_name: spring-boot-core-engine
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://signalpost-database:5432/signalpost_analytics_prod
      - SPRING_DATASOURCE_USERNAME=engine_admin_chandra
      - SPRING_DATASOURCE_PASSWORD=VaultProductionPassword2026_Secure
      - AGENT_SERVICE_URL=http://signalpost-agent:8000
    depends_on:
      signalpost-database:
        condition: service_healthy
      signalpost-agent:
        condition: service_started
    restart: always

  signalpost-frontend:
    build: ./frontend
    container_name: signalpost-enterprise-ui
    ports:
      - "3000:3000"
    environment:
      - VITE_BACKEND_API_URL=http://localhost:8080
    depends_on:
      - signalpost-core-backend
    restart: always
