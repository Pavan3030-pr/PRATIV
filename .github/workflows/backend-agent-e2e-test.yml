name: Backend & Agent E2E Test

on:
  push:
  workflow_dispatch:

jobs:
  e2e-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: ankane/pgvector:v0.5.1
        env:
          POSTGRES_DB: signalpost_analytics_prod
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Initialize PostgreSQL Database
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d signalpost_analytics_prod -f db/init.sql

      - name: Build and Start AI Agent
        run: |
          cd agent
          pip install -r requirements.txt
          nohup python main.py > agent.log 2>&1 &
          echo "Waiting for AI agent..."
          for i in {1..30}; do
            if curl -s http://localhost:8000/health > /dev/null; then
              echo "AI Agent is ready!"
              break
            fi
            sleep 1
          done

      - name: Test AI Agent Endpoints
        run: |
          echo "=== Health Check ==="
          curl -s http://localhost:8000/health
          echo -e "\n=== Crawl Equinor ASA (923609016) ==="
          curl -s -X POST http://localhost:8000/api/v1/crawl/923609016
          echo -e "\n=== Crawl Invalid RegNum (invalid123) ==="
          curl -s -X POST http://localhost:8000/api/v1/crawl/invalid123

      - name: Build and Start Backend
        run: |
          cd backend
          mvn clean package -DskipTests
          nohup java -jar target/*.jar > backend.log 2>&1 &
          echo "Waiting for Backend..."
          for i in {1..40}; do
            if curl -s http://localhost:8080/api/companies > /dev/null; then
              echo "Backend is ready!"
              break
            fi
            sleep 1
          done

      - name: Test Backend API Endpoints
        run: |
          echo "=== Auth Session Endpoint ==="
          curl -s -X POST http://localhost:8080/api/auth/session
          echo -e "\n=== Get Companies Endpoint ==="
          curl -s http://localhost:8080/api/companies
          echo -e "\n=== Company Lookup DNB Bank ASA (984851006) ==="
          curl -s -X POST http://localhost:8080/api/companies/lookup/984851006
          echo -e "\n=== Metrics Endpoint ==="
          curl -s http://localhost:8080/api/metrics
