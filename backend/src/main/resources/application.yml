server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

spring:
  application:
    name: signalpost-core-engine
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}
            scope:
              - openid
              - profile
              - email
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            redirect-uri: ${GITHUB_REDIRECT_URI:http://localhost:8080/login/oauth2/code/github}
            scope:
              - read:user
              - user:email
        provider:
          github:
            user-name-attribute: login
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/signalpost_analytics_prod}
    username: ${SPRING_DATASOURCE_USERNAME:engine_admin_chandra}
    password: ${SPRING_DATASOURCE_PASSWORD:signalpost_local_dev}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

agent:
  service:
    url: ${AGENT_SERVICE_URL:http://localhost:8000}

security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:prativ-api}
    audience: ${JWT_AUDIENCE:prativ-api}
    lifetime: ${JWT_LIFETIME:PT15M}
  cors:
    allowed-origins: ${FRONTEND_ORIGINS:http://localhost:3000,http://localhost:5173}
  frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}
